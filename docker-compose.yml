services:
  indiekit:
    container_name: indiekit
    image: getindiekit/indiekit
    restart: always
    build: .
    ports:
      - ${HTTP_PORT:-3000}:3000
    environment:
      - MONGO_URL=mongodb://$MONGO_INITDB_ROOT_USERNAME:$MONGO_INITDB_ROOT_PASSWORD@mongo
      - PASSWORD_SECRET
      - SECRET
      - GITHUB_TOKEN
      - MASTODON_ACCESS_TOKEN
      - BLUESKY_PASSWORD
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - WEBMENTION_IO_TOKEN
  mongo:
    container_name: mongo
    image: ${MONGO_IMAGE:?Set MONGO_IMAGE to the version compatible with your volume}
    restart: always
    volumes:
      - mongo:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
volumes:
  mongo:
    external: true
